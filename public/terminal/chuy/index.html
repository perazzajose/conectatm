<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartel Terminal Chuy</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#000;--panel:#0a0a0a;--line:#232323;--txt:#f2f2f2;--muted:#9a9a9a;--amber:#ffd400;--cel:#2f6dff;--green:#2fd67b;--red:#ff4d4d;--blue:#4aa3ff;--ama:#ffe11a;--azu:#1e4fd8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}
button,input,select{font:inherit}
/* ---------- CARTEL ---------- */
.board{height:100vh;display:flex;flex-direction:column;padding:1.6vh 1.6vw;gap:1.4vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:2vw}
.brand{display:flex;flex-direction:column}
.brand h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:4.6vh;letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:1.9vh}
.clock{text-align:right;font-family:'Barlow Condensed','Arial Narrow',sans-serif}
.clock b{display:block;font-size:6.4vh;color:var(--amber);line-height:1;font-variant-numeric:tabular-nums}
.clock span{font-size:2vh;color:var(--muted)}
.demo{background:var(--amber);color:#1a1200;font-weight:700;font-size:1.7vh;text-align:center;padding:.5vh;border-radius:2px;letter-spacing:.04em}
.cols{flex:1;display:grid;grid-template-columns:1fr;min-height:0}
.col{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.colh{display:flex;align-items:center;gap:1vw;padding:1.2vh 1.2vw;border-bottom:3px solid var(--cel)}
.colh .ic{font-size:3.6vh}
.colh h2{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:4.2vh;text-transform:uppercase;letter-spacing:.05em}
.colh small{margin-left:auto;color:var(--muted);font-size:1.8vh}
.thead,.row{display:grid;grid-template-columns:9% 11% 17% 1fr 7% 17%;align-items:center;padding:0 1.2vw;gap:.8vw}
.thead{color:var(--muted);font-size:1.6vh;text-transform:uppercase;letter-spacing:.08em;padding-top:1vh;padding-bottom:1vh;border-bottom:1px solid var(--line)}
.rows{flex:1;display:flex;flex-direction:column;min-height:0}
.row{flex:0 0 auto;height:calc(100%/10);border-bottom:1px solid var(--line);font-size:2.7vh}

.row .h{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:3.6vh;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1}
.row .h s{display:block;font-size:1.6vh;color:var(--muted);font-family:Inter,sans-serif;font-weight:500}
.row .e{font-weight:600;font-size:2.3vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:2.8vh;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:3.3vh;text-align:center;color:var(--cel)}
.st{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:2.1vh;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:0;padding:.5vh .4vw;border-radius:3px;text-align:center;white-space:nowrap}
.st-programado{background:#1c3768;color:#cfe0ff}
.st-embarcando{background:var(--green);color:#03240f;animation:blink 1.2s steps(2) infinite}
.st-demorado{background:var(--amber);color:#2a1d00}
.st-salio,.st-arribo{background:transparent;color:var(--muted);border:1px solid var(--line)}
.st-encamino{background:var(--blue);color:#00142e}
.st-cancelado{background:var(--red);color:#fff}
@keyframes blink{50%{opacity:.55}}
.tp{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:2.3vh;text-transform:uppercase;padding:.4vh .5vw;border-radius:3px;text-align:center}.tp-salida{background:var(--cel);color:#00262a}.tp-llegada{background:var(--amber);color:#2a1d00}
.row.r-salida{box-shadow:inset .5vw 0 0 var(--cel);background:rgba(12,205,217,.06)}.row.r-llegada{box-shadow:inset .5vw 0 0 var(--amber);background:rgba(255,200,61,.06)}
.row .d .ch{color:var(--muted);font-weight:500}.row .d .ar{color:var(--muted);margin:0 .4vw}
.row .d .nt{display:block;font-family:Inter,sans-serif;font-size:1.6vh;font-weight:500;color:var(--muted);text-transform:none;line-height:1.1}
.empty{color:var(--muted);font-size:2.4vh;padding:3vh 1.2vw}
.ticker{background:var(--cel);color:#00262a;font-weight:700;font-size:2.6vh;overflow:hidden;white-space:nowrap;height:5vh;display:flex;align-items:center}
.ticker div{display:inline-block;padding-left:2vw;animation:tick 32s linear infinite}
@keyframes tick{from{transform:translateX(40vw)}to{transform:translateX(-100%)}}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:1.6vh}
.fs{position:fixed;right:1vw;bottom:1vh;opacity:.0;background:var(--line);color:var(--txt);border:0;padding:.6em 1em;border-radius:4px;cursor:pointer}
.board:hover .fs{opacity:.9}
@media (orientation:portrait){.cols{grid-template-columns:1fr}.row{font-size:1.9vh}.brand h1{font-size:3vh}}
/* ---------- PANEL ---------- */
.panel{max-width:760px;margin:0 auto;padding:16px 14px 90px;font-size:15px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ph h1{font-size:20px}
.sync{font-size:12px;padding:4px 8px;border-radius:20px;background:var(--line);color:var(--muted)}
.sync.ok{background:#0f3d27;color:#7ff0b0}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;font-weight:600}
.tabs button.on{background:var(--cel);color:#00262a;border-color:var(--cel)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.card .r1{display:flex;align-items:baseline;gap:10px}
.card .r1 b{font-size:22px;color:var(--amber);font-family:'Barlow Condensed','Arial Narrow',sans-serif}
.card .r1 .dd{font-weight:600;flex:1}
.card .r1 .x{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
.card .sub{color:var(--muted);font-size:13px;margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#0e2550;color:var(--txt);padding:7px 10px;border-radius:20px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--cel);color:#00262a;border-color:var(--cel);font-weight:700}
.extra{display:flex;gap:8px;margin-top:8px;align-items:center;font-size:13px;color:var(--muted)}
.extra input{width:90px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;background:#071631;border:1px solid var(--line);color:var(--txt);padding:9px;border-radius:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--cel);color:#00262a;border:0;padding:11px 14px;border-radius:8px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.links{display:flex;gap:8px;margin-top:6px}
.links a{color:var(--cel);font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
h3{font-size:14px;margin:18px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.top{position:relative;padding-bottom:1.2vh}
.top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:.6vh;background:linear-gradient(90deg,var(--ama) 0 50%,var(--azu) 50% 100%)}
.brand{flex-direction:row!important;align-items:center;gap:1.4vw}
.brand .tx{display:flex;flex-direction:column}

  '<div class="tabs"><button data-f="todos" class="'+(filtro==='todos'?'on':'')+'">Todos</button><button data-f="salida" class="'+(filtro==='salida'?'on':'')+'">Salidas</button><button data-f="llegada" class="'+(filtro==='llegada'?'on':'')+'">Llegadas</button></div>'+cards+
  '<h3>Agregar servicio</h3><div class="card"><div class="tabs" style="margin-top:0"><button data-tab="salida" class="'+(tab==='salida'?'on':'')+'">Salida</button><button data-tab="llegada" class="'+(tab==='llegada'?'on':'')+'">Llegada</button></div><div class="grid2"><div><label>Hora</label><input id="nHora" type="time"></div><div><label>Andén</label><input id="nAnden" placeholder="1"></div></div>'+
  '<label>Días</label><select id="nDias"><option value="">Todos los días</option><option value="1,2,3,4,5">Lunes a viernes</option><option value="1,2,3,4,5,6">Lunes a sábado</option><option value="6">Sábados</option><option value="0">Domingos</option><option value="0,6">Fines de semana</option></select><label>Empresa</label><input id="nEmp" placeholder="Ej.: COT"><label>'+(tab==='salida'?'Destino':'Origen')+'</label><input id="nLug" placeholder="Ej.: Montevideo"><button class="btn" id="add">Agregar</button></div>'+
  '<h3>Aviso que corre abajo</h3><div class="card"><input id="aviso" value="'+esc(state.aviso)+'"><button class="btn" id="saveAviso">Guardar aviso</button></div>'+
  '<h3>Demostración</h3><div class="card"><label style="display:flex;gap:8px;align-items:center;color:var(--txt);font-size:14px"><input type="checkbox" id="demo" style="width:auto" '+(state.demo?'checked':'')+'> Mostrar la franja "a confirmar"</label>'+
  '<p class="note">Los cambios se ven en el cartel al instante en todas las pantallas que lo tengan abierto.</p></div></div>';
}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('button,a');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();return}
  if(t.dataset.f){filtro=t.dataset.f;render();return}
  if(t.dataset.st){nuevoDia();var s=find(t.dataset.id);s.estado=t.dataset.st;if(s.estado!=='demorado')s.nueva='';save();return}
  if(t.dataset.del){var i=state.servicios.findIndex(function(x){return x.id===t.dataset.del});if(i>=0){state.servicios.splice(i,1);save()}return}
  if(t.id==='add'){var h=val('nHora'),e=val('nEmp'),l=val('nLug');if(!h||!e||!l)return;
    state.servicios.push({id:tab[0]+Date.now().toString(36),tipo:tab,hora:h,empresa:e,lugar:l,nota:'',est:0,dias:(val('nDias')?val('nDias').split(',').map(Number):null),anden:val('nAnden'),estado:'programado',nueva:''});save();return}
  if(t.id==='saveAviso'){state.aviso=val('aviso');save();return}
});
document.addEventListener('change',function(ev){var t=ev.target;
  if(t.dataset&&t.dataset.nueva){nuevoDia();find(t.dataset.nueva).nueva=t.value;save()}
  if(t.id==='demo'){state.demo=t.checked;save()}
});
function nuevoDia(){if(state.fecha!==hoyStr()){state.servicios.forEach(function(x){x.estado='programado';x.nueva=''});state.fecha=hoyStr()}}
function diasTxt(d){var k=d.join(',');return {'1,2,3,4,5':'lun a vie','1,2,3,4,5,6':'lun a sáb','6':'sábados','0':'domingos','1':'solo lunes','0,1,2,3,4,5':'dom a vie','0,6':'fines de semana'}[k]||'días especiales'}
function val(id){var el=document.getElementById(id);return el?el.value.trim():''}
function find(id){return state.servicios.filter(function(s){return s.id===id})[0]}
function buildDoc(){
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartel Terminal Chuy</title>'+FONTS+'<style id="css">'+CSS+'</style></head><body><div id="root"></div><script type="application/json" id="state">'+json+'<\/script><script id="app">'+APP+'<\/script></body></html>';
}
function save(){
  try{localStorage.setItem(LKEY,JSON.stringify({_seed:hash(SEED),s:state}))}catch(e){}
  render();
  if(art){clearTimeout(pubTimer);pubTimer=setTimeout(function(){art.publish(buildDoc()).catch(function(){})},1200)}
}
window.addEventListener('hashchange',render);
setInterval(function(){if(view()==='cartel'){lang=lang?0:1;render()}},10000);
setInterval(function(){if(view()==='cartel')render()},30000);
render();
try{window.claude&&window.claude.use&&window.claude.use('artifact').then(function(a){if(a){art=a;sync='ok';render()}}).catch(function(){})}catch(e){}
})();
</script></body></html>
