  <script>
    const tl = gsap.timeline({ paused: true });
    const N = 8;
    const tit = [], tag = [], tip = [];
    for (let i = 0; i < N; i++) { tit.push("#t" + i); tag.push("#tg" + i); tip.push("#p" + i); }
    function cambio(i, t) {
      tl.to([tit[i - 1], tip[i - 1]], { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in" }, t - 0.2);
      tl.to(tag[i - 1], { opacity: 0, duration: 0.15 }, t - 0.2);
      tl.fromTo(tit[i], { opacity: 0, y: 24, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, t);
      tl.fromTo(tip[i], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t + 0.12);
      tl.fromTo(tag[i], { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, t);
      // Mientras se lee, el título crece apenas
      tl.fromTo(tit[i], { scale: 1 }, { scale: 1.05, duration: 2.4, ease: "sine.inOut", transformOrigin: "0% 50%" }, t + 0.35);
    }
    // Estado inicial: las secciones no se ven todavía
    gsap.set("#badge", { scale: 0 });
    gsap.set("#exp-tacha", { scaleX: 0 });

    // Escena 1 (gancho): el "?" late en la experiencia vacía

    tl.to("#cv", { scale: 1.05, duration: 2.3, ease: "sine.inOut", transformOrigin: "50% 480px" }, 0);

    // Escena 2: "experiencia" se tacha, el "?" sube a la insignia y aparecen los 5 renglones
    const A = 2.5;
    cambio(1, A);
    tl.to("#cv", { scale: 1, duration: 0.3, ease: "power2.inOut" }, A);
    tl.to("#exp-tacha", { scaleX: 1, duration: 0.3, ease: "power2.out" }, A + 0.1);
    tl.to("#q-grande", { x: 450, y: -470, scale: 0.3, duration: 0.5, ease: "power3.inOut" }, A + 0.3);
    tl.to("#q-grande", { opacity: 0, duration: 0.1 }, A + 0.75);

    tl.to(".slot .lab", { opacity: 1, duration: 0.2, stagger: 0.08 }, A + 0.65);
    tl.to(".slot .ph", { opacity: 1, duration: 0.2, stagger: 0.08 }, A + 0.7);

    // Las 5 secciones: la tarjeta sale de abajo del consejo y baja a su renglón
    const T = [4.9, 7.9, 10.9, 13.9, 16.9];
    const SLOT = [158, 282, 406, 530, 654];
    const SALIDA = 476 - 560; // borde de abajo del consejo, en coordenadas del CV
    for (let i = 0; i < 5; i++) {
      const t = T[i];
      const card = "#s" + i + " .card";
      const dy = SALIDA - (SLOT[i] + 38);
      cambio(i + 2, t);
      tl.to("#cv", { scale: 1, duration: 0.3, ease: "power2.inOut" }, t);
      // Mientras se lee, la vista se acerca a la sección nueva
      tl.to("#cv", { scale: 1.045, duration: 1.7, ease: "sine.inOut", transformOrigin: "50% " + (SLOT[i] + 80) + "px" }, t + 1.2);
      tl.fromTo(card, { opacity: 0, y: dy, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, t + 0.2);
      tl.to(card, { y: 0, duration: 0.6, ease: "power3.inOut" }, t + 0.5);
      tl.to("#s" + i + " .ph", { opacity: 0, duration: 0.15 }, t + 1.05);
      tl.to("#s" + i + " .lab", { color: "#8e3a86", duration: 0.2 }, t + 1.05);
      tl.to(card, { scale: 1.03, duration: 0.15, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + 1.1);
      // Mientras se lee: un brillo recorre la tarjeta y la insignia se mueve
      tl.fromTo("#s" + i + " .brillo", { x: 0 }, { x: 1250, duration: 1.1, ease: "power1.inOut" }, t + 1.35);
      tl.to("#badge", { rotation: 10, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, t + 2.1);
    }

    // Escena 4: CV completo, el "?" pasa a ✓
    const F = 19.9;

    tl.set("#badge", { backgroundColor: "#1f8f4e" }, F + 0.44);

    tl.to("#badge", { scaleX: 1, duration: 0.2, ease: "back.out(2)" }, F + 0.44);

    tl.to("#cv", { scale: 1.03, duration: 1.9, ease: "sine.inOut", transformOrigin: "50% 50%" }, F + 0.35);
