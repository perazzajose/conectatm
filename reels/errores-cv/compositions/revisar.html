  <script>
    const tl = gsap.timeline({ paused: true });
    // Lupa: centro en un punto del documento (coordenadas del documento)
    const DX = 220, DY = 600, R = 230, M = 1.45, B = 14;
    function lupa(px, py, t, dur, ease) {
      const props = { x: DX + px - R, y: DY + py - R };
      const inner = { x: R - B - M * px + B, y: R - B - M * py + B };
      if (t === 0) {
        tl.set("#lupa", { x: props.x, y: props.y }, 0);
        tl.set("#lupa-in", { x: inner.x, y: inner.y, scale: M, transformOrigin: "0px 0px" }, 0);
      } else {
        tl.to("#lupa", { ...props, duration: dur, ease: ease || "power3.inOut" }, t);
        tl.to("#lupa-in", { ...inner, duration: dur, ease: ease || "power3.inOut" }, t);
      }
    }
    const P = [[215, 55], [100, 140], [250, 343], [180, 445], [150, 640]];
    const T = [2.4, 5.6, 8.8, 12.0, 15.2];
    // Cuadro 0: título, CV y la lupa ya sobre el nombre del archivo
    lupa(290, 55, 0);
    lupa(230, 60, 0.2, 2.0, "sine.inOut");
    const titulos = ["#t0", "#t1", "#t2", "#t3", "#t4", "#t5", "#t6"];
    const tagsel = ["#tg0", "#tg1", "#tg2", "#tg3", "#tg4", "#tg5", "#tg6"];
    function cambio(i, t) {
      tl.to(titulos[i - 1], { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in" }, t - 0.2);
      tl.to(tagsel[i - 1], { opacity: 0, duration: 0.15 }, t - 0.2);
      tl.fromTo(titulos[i], { opacity: 0, y: 24, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, t);
      tl.fromTo(tagsel[i], { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, t);
    }
    for (let i = 0; i < 5; i++) {
      const t = T[i];
      cambio(i + 1, t);
      lupa(P[i][0], P[i][1], t, 0.6);
      tl.fromTo(".mk" + i, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.25, stagger: 0.12, ease: "back.out(2)" }, t + 0.65);
      // La lupa sigue recorriendo despacio mientras se lee
      lupa(P[i][0] + 20, P[i][1] + 8, t + 0.7, 2.2, "sine.inOut");
    }
    // Se arregla todo
    const F = 18.4;
    cambio(6, F);
    tl.to("#lupa", { x: 1200, y: 300, rotation: 20, duration: 0.5, ease: "power3.in" }, F - 0.1);
    tl.to(".marca", { opacity: 0, duration: 0.25 }, F + 0.2);
    const pares = ["arch", "cara", "mail", "orto", "orto2", "exp"];
    pares.forEach((k, i) => {
      tl.to(".mal-" + k, { opacity: 0, duration: 0.2 }, F + 0.35 + i * 0.18);
      tl.fromTo(".ok-" + k, { opacity: 0 }, { opacity: 1, duration: 0.25 }, F + 0.4 + i * 0.18);
      tl.set(".mal-" + k, { display: "none" }, F + 0.6 + i * 0.18);
    });
    tl.fromTo("#doc", { scale: 1 }, { scale: 1.04, duration: 2.0, ease: "sine.inOut" }, F + 0.4);
    tl.fromTo("#chip", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, F + 1.6);
    // Salida
    tl.to(["#t6", "#tg6"], { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, 21.6);
    tl.to(["#doc", "#sombra", "#chip"], { y: -1600, duration: 0.4, ease: "power3.in" }, 21.55);
    window.__timelines["revisar"] = tl;
  </script>
