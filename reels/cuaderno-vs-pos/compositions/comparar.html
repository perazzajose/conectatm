  <script>
    const tl = gsap.timeline({ paused: true });
    const titulos = ["#t1", "#t2", "#t3", "#t4", "#t5"];
    const capas = ["#nb1", "#nb2", "#nb3", "#nb4", "#nb5"];
    const pantallas = ["#p1", "#p2", "#p3", "#p4", "#p5"];
    // Inicio de cada escena (s)
    const T = [0, 3, 7, 11, 14.6];

    // Estado inicial: escena 1 completa en el cuadro 0

    // Escena 1: pequeños movimientos para que no quede quieto
    tl.fromTo("#pos", { y: 40 }, { y: 0, duration: 0.8, ease: "expo.out" }, 0);
    tl.fromTo("#nb-clip", { rotation: -1.5 }, { rotation: 0, duration: 0.8, ease: "expo.out" }, 0);
    tl.fromTo("#p1-r3", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.8);
    const tot = { v: 384 };
    const totEl = document.querySelector("#p1-total");
    tl.fromTo(tot, { v: 384 }, { v: 443, duration: 0.4, ease: "power2.out", onUpdate: () => { totEl.textContent = "$" + Math.round(tot.v); } }, 0.95);
    tl.fromTo("#p1 .total", { scale: 1 }, { scale: 1.08, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "100% 50%" }, 1.6);

    // Cambio de escena: título, hoja del cuaderno y pantalla del POS
    function cambio(i) {
      const t = T[i];
      tl.to(titulos[i - 1], { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in" }, t - 0.2);
      tl.fromTo(titulos[i], { opacity: 0, filter: "blur(10px)", y: 20 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.3, ease: "power4.out" }, t);
      // Pasa la hoja del cuaderno
      tl.set("#hoja", { opacity: 1, rotationX: 0 }, t - 0.25);
      tl.to("#hoja", { rotationX: -88, duration: 0.42, ease: "power2.in" }, t - 0.25);
      tl.set("#hoja", { opacity: 0 }, t + 0.18);
      tl.set(capas[i - 1], { opacity: 0 }, t - 0.05);
      tl.set(capas[i], { opacity: 1 }, t - 0.05);
      // El POS cambia de pantalla como una app
      tl.to(pantallas[i - 1], { x: -960, duration: 0.4, ease: "power3.inOut" }, t - 0.2);
      tl.set(pantallas[i], { opacity: 1 }, t - 0.21);
      tl.fromTo(pantallas[i], { x: 960 }, { x: 0, duration: 0.4, ease: "power3.inOut" }, t - 0.2);
    }
    for (let i = 1; i < 5; i++) cambio(i);

    // La división se corre hacia el POS en cada escena
    const recorte = [0, 0, 90, 170, 250];
    for (let i = 2; i < 5; i++) {
      tl.to("#nb-clip", { clipPath: `inset(0px 0px ${recorte[i]}px 0px round 18px)`, duration: 0.5, ease: "power3.inOut" }, T[i] - 0.2);
      tl.to(["#pos", "#pos-tag"], { y: -recorte[i] + 0, duration: 0.5, ease: "power3.inOut" }, T[i] - 0.2);
    }

    // Acercamiento lento de cámara en cada escena, para que nunca quede quieto
    const fin = [3, 7, 11, 14.6, 17.55];
    for (let i = 0; i < 5; i++) {
      tl.to(["#pos", "#nb-clip"], { scale: 1.04, duration: fin[i] - T[i] - 0.45, ease: "sine.inOut" }, T[i] + 0.2);
      if (i < 4) tl.to(["#pos", "#nb-clip"], { scale: 1, duration: 0.4, ease: "power3.inOut" }, fin[i] - 0.22);
    }

    // Escena 2: precio. El cuaderno duda, el POS escanea
    tl.fromTo("#nb2 p:nth-child(2)", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.6);
    tl.to("#laser", { opacity: 1, duration: 0.1 }, 3.6);
    tl.fromTo("#laser", { y: -60 }, { y: 60, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.6);
    tl.to("#laser", { opacity: 0, duration: 0.1 }, 4.6);
    tl.fromTo("#precio", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 4.65);
    tl.to("#nb-clip", { x: -10, duration: 0.06, yoyo: true, repeat: 5, ease: "none" }, 5.6);

    // Escena 3: stock. Baja de 3 a 2 y aparece "Reponer"
    tl.to("#st3", { y: -50, opacity: 0, duration: 0.3, ease: "power2.in" }, 7.9);
    tl.fromTo("#st2", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 8.0);
    tl.fromTo("#reponer", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 8.7);
    tl.fromTo("#st-aceite", { backgroundColor: "#ffffff" }, { backgroundColor: "#fff1e2", duration: 0.4 }, 8.7);
    tl.fromTo("#nb3 p:nth-child(2)", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 9.4);
    tl.to("#nb-clip", { x: -10, duration: 0.06, yoyo: true, repeat: 5, ease: "none" }, 10.0);

    // Escena 4: vencimientos. Alerta en el POS, nada en el cuaderno
    tl.fromTo("#alerta", { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, 11.5);
    tl.fromTo("#venc-2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 12.2);
    tl.fromTo("#venc-3", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 12.8);
    tl.fromTo("#nb4 p:nth-child(2)", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 13.3);
    tl.fromTo("#alerta-icono", { scale: 1 }, { scale: 1.2, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, 13.7);

    // Escena 5: cierre de caja. Borrón en el cuaderno, total en el POS
    tl.fromTo("#borron", { opacity: 0, x: -60 }, { opacity: 1, x: 40, duration: 0.6, ease: "power1.inOut" }, 15.8);
    const caja = { v: 0 };
    const totalEl = document.querySelector("#caja-total");
    tl.fromTo(
      caja,
      { v: 0 },
      {
        v: 12480,
        duration: 1.3,
        ease: "power3.out",
        onUpdate: () => {
          totalEl.textContent = "$" + Math.round(caja.v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        },
      },
      15.0
    );
    tl.fromTo(["#chip1", "#chip2"], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.18, ease: "power3.out" }, 16.2);

    // Salida: el cuaderno desaparece y el POS ocupa todo
    tl.to("#nb-clip", { clipPath: "inset(0px 0px 420px 0px round 18px)", duration: 0.4, ease: "power3.in" }, 17.55);
    tl.to("#nb-tag", { opacity: 0, duration: 0.2 }, 17.55);
    tl.to("#t5", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, 17.7);
    tl.to("#pos", { y: -560, scale: 1.08, duration: 0.45, ease: "power3.in" }, 17.55);
    tl.to("#pos-tag", { opacity: 0, duration: 0.2 }, 17.55);

    window.__timelines["comparar"] = tl;
  </script>
