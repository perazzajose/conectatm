  <script>
    const tl = gsap.timeline({ paused: true });
    const OPC = [805, 1346, 1969, 2603]; // y de cada opción tocada en la captura
    const OFF = [270, 830, 1430, 1626]; // cuánto se corre la captura en cada paso
    const OUT = { opacity: 0, y: -10, filter: "blur(10px)", duration: 0.18, ease: "power2.in" };
    const titIn = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 24, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, t);

    // Estado inicial de lo que viene después (fuera de la línea de tiempo)
    gsap.set("#pila", { y: -OFF[0] });
    gsap.set("#res", { y: 1300 });
    gsap.set(["#s1", "#s2"], { scaleX: 0 });

    // ---------- Escena 1 (0 – 3.4): de 8 a 2 ----------
    tl.fromTo("#tit1", { scale: 1 }, { scale: 1.05, duration: 3.2, ease: "sine.inOut" }, 0);
    tl.fromTo("#grid", { y: 0 }, { y: -14, duration: 3.2, ease: "sine.inOut" }, 0);
    tl.fromTo("#filtro", { opacity: 0, x: -30, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.55);
    // El filtro apaga a los que no aceptan Pix, igual que en la web
    tl.to(["#t1", "#t2", "#t3", "#t4", "#t5", "#t7"], { opacity: 0.16, scale: 0.9, duration: 0.3, stagger: 0.09, ease: "power2.out" }, 0.95);
    tl.to(["#t0", "#t6"], { scale: 1.08, duration: 0.4, ease: "back.out(2.2)" }, 1.55);
    tl.to(["#b0", "#b6"], { opacity: 1, duration: 0.2 }, 1.55);
    const num = { v: 8 };
    tl.to(num, { v: 2, duration: 0.6, ease: "power1.inOut", onUpdate: () => { document.querySelector("#num").textContent = Math.round(num.v); } }, 0.95);
    tl.fromTo("#num", { scale: 1 }, { scale: 1.25, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "50% 60%" }, 1.55);
    tl.to("#sub-a", { opacity: 0, y: -20, duration: 0.2, ease: "power2.in" }, 1.35);
    tl.fromTo("#sub-b", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power4.out" }, 1.55);
    tl.to(["#b0", "#b6"], { opacity: 0.55, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 2.0);
    // Salida: todo arriba; el filtro baja a la pregunta real
    tl.to(["#tit1", "#grid", "#cuenta", "#sub-a", "#sub-b", "#fuente"], { y: -1600, duration: 0.4, ease: "power3.in", stagger: 0.03 }, 3.0);
    tl.to("#filtro", { y: 280, scale: 0.8, opacity: 0, duration: 0.45, ease: "power3.in" }, 3.0);

    // ---------- Escena 2 (3.4 – 10.6): las 4 preguntas ----------
    tl.set("#e2", { opacity: 1 }, 3.35);
    tl.fromTo("#panel", { y: 1500 }, { y: 0, duration: 0.5, ease: "expo.out" }, 3.35);
    tl.fromTo("#et2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, 3.45);
    titIn("#tit2a", 3.5);
    const T = [4.25, 5.85, 7.45, 9.05]; // toques
    const TITS = ["#tit2a", "#tit2b", "#tit2c", "#tit2d"];
    const ETQ = ["Paso 1 de 4", "Paso 2 de 4", "Paso 3 de 4", "Paso 4 de 4"];
    T.forEach((t, i) => {
      if (i > 0) {
        // Se corre la página hasta la pregunta siguiente
        tl.to("#pila", { y: -OFF[i], duration: 0.6, ease: "power2.inOut" }, t - 0.85);
        tl.to(TITS[i - 1], OUT, t - 0.85);
        titIn(TITS[i], t - 0.62);
        tl.set("#et2", { textContent: ETQ[i] }, t - 0.62);
        tl.fromTo("#et2", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, t - 0.62);
      }
      // Marca de la opción y toque
      tl.set("#marca", { top: OPC[i], opacity: 0, scale: 1 }, t - 0.2);
      tl.set("#toque", { left: 330, top: OPC[i] + 70 }, t - 0.2);
      tl.fromTo("#toque", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.5, ease: "power2.out" }, t);
      tl.set(`#q${i + 1}`, { opacity: 1 }, t + 0.05);
      tl.fromTo("#marca", { opacity: 1, scale: 1.04 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, t + 0.05);
      tl.to("#marca", { opacity: 0, duration: 0.3 }, t + 0.9);
    });
    // Mientras se lee, la página respira un poco
    tl.to("#panel", { scale: 1.02, duration: 6.8, ease: "sine.inOut" }, 3.85);

    // ---------- Escena 3 (10.6 – 15.4): el resultado ----------
    // Igual que en la web: el resultado está abajo de las preguntas
    tl.to("#pila", { y: -OFF[3] - 1250, duration: 0.6, ease: "power2.inOut" }, 10.0);
    tl.set("#res", { opacity: 1 }, 10.0);
    tl.to("#res", { y: 0, duration: 0.6, ease: "power2.inOut" }, 10.0);
    tl.to("#panel", { backgroundColor: "#1e1428", duration: 0.3 }, 10.2);
    tl.to("#tit2d", OUT, 10.0);
    tl.set("#et2", { textContent: "Resultado" }, 10.25);
    tl.fromTo("#et2", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 10.25);
    titIn("#tit3", 10.25);
    tl.to("#s1", { scaleX: 1, duration: 0.45, ease: "power3.out" }, 11.2);
    tl.to("#s2", { scaleX: 1, duration: 0.45, ease: "power3.out" }, 12.2);
    tl.fromTo("#cam", { scale: 1 }, { scale: 1.04, duration: 3.95, ease: "sine.inOut", transformOrigin: "50% 30%" }, 10.6);

    // ---------- Escena 4 (14.6 – 18.2): las comisiones ----------
    tl.to("#tit3", OUT, 14.6);
    tl.set("#et2", { textContent: "Antes de firmar" }, 14.8);
    tl.fromTo("#et2", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 14.8);
    titIn("#tit4", 14.8);
    // Acercamiento a la línea real que pide preguntar las comisiones
    tl.to("#cam", { scale: 1.25, x: 0, y: -500, duration: 0.7, ease: "power3.inOut", transformOrigin: "50% 30%" }, 14.6);
    tl.fromTo("#s3", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 15.35);
    tl.to("#s3", { scale: 1.04, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, 15.8);
    tl.fromTo("#aviso", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 15.6);
    tl.to("#cam", { scale: 1.29, duration: 1.8, ease: "sine.inOut" }, 15.35);
    // Salida hacia el cierre
    tl.to(["#tit4", "#et2", "#panel", "#aviso", "#handle"], { y: -1600, duration: 0.4, ease: "power3.in", stagger: 0.03 }, 17.75);

    window.__timelines["pix"] = tl;
  </script>
